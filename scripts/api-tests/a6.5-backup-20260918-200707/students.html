<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IDMC iMIS | Students</title>

    <link
        rel="stylesheet"
        href="assets/css/app.css"
    >

    <style>

        body {
            margin: 0;
            background: #faf7f7;
            color: #2a1116;
            font-family: Inter, Arial, sans-serif;
        }

        .students-page {
            max-width: 1250px;
            margin: auto;
            padding: 25px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-family: Georgia, serif;
            color: #4a0d1c;
        }

        .subtitle {
            margin-top: 5px;
            color: #7c6165;
            font-size: 12px;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr 180px 110px 120px;
            gap: 10px;
            margin-bottom: 14px;
        }

        input,
        select,
        button {
            min-height: 42px;
            padding: 9px 11px;
            border: 1px solid #e8dee1;
            background: white;
            font: inherit;
        }

        button {
            background: #4a0d1c;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        button.secondary {
            background: white;
            color: #4a0d1c;
        }

        .card {
            background: white;
            border: 1px solid #e8dee1;
        }

        .card-header {
            padding: 14px 16px;
            border-bottom: 1px solid #e8dee1;
            display: flex;
            justify-content: space-between;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 11px 13px;
            border-bottom: 1px solid #f0e8ea;
            font-size: 12px;
            text-align: left;
        }

        th {
            background: #fcf9fa;
            color: #4a0d1c;
            text-transform: uppercase;
            font-size: 10px;
        }

        .status {
            color: #7c6165;
            font-size: 11px;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 28px;
            color: #7c6165;
        }

        .error {
            color: #4a0d1c;
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(20, 5, 10, .45);
            z-index: 1000;
            padding: 20px;
        }

        .modal.open {
            display: flex;
        }

        .modal-card {
            width: 100%;
            max-width: 850px;
            max-height: 90vh;
            overflow: auto;
            background: white;
            border: 1px solid #e8dee1;
        }

        .modal-header {
            padding: 15px 18px;
            border-bottom: 1px solid #e8dee1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            color: #4a0d1c;
            font-family: Georgia, serif;
        }

        .form-grid {
            padding: 18px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            font-size: 10px;
            font-weight: 700;
            color: #4a0d1c;
            text-transform: uppercase;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 15px 18px;
            border-top: 1px solid #e8dee1;
        }

        .action-btn {
            min-height: 32px;
            padding: 5px 9px;
            font-size: 11px;
        }

        @media (max-width: 850px) {

            .toolbar,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<main class="students-page">

    <header class="header">

        <div>
            <h1>Students</h1>

            <div class="subtitle">
                IDMC iMIS Student Management
            </div>
        </div>

        <button
            id="addStudentButton"
            type="button"
        >
            Add Student
        </button>

    </header>

    <section class="toolbar">

        <input
            id="searchInput"
            type="search"
            placeholder="Search student number, name, email..."
        >

        <select id="statusFilter">

            <option value="">
                All statuses
            </option>

            <option value="ACTIVE">
                ACTIVE
            </option>

            <option value="INACTIVE">
                INACTIVE
            </option>

            <option value="SUSPENDED">
                SUSPENDED
            </option>

            <option value="GRADUATED">
                GRADUATED
            </option>

            <option value="WITHDRAWN">
                WITHDRAWN
            </option>

            <option value="DEFERRED">
                DEFERRED
            </option>

        </select>

        <button
            id="searchButton"
            type="button"
        >
            Search
        </button>

        <button
            id="refreshButton"
            type="button"
            class="secondary"
        >
            Refresh
        </button>

    </section>

    <section class="card">

        <div class="card-header">

            <strong>
                Student Records
            </strong>

            <span
                id="recordStatus"
                class="status"
            >
                Loading...
            </span>

        </div>

        <div style="overflow-x:auto;">

            <table>

                <thead>

                    <tr>

                        <th>
                            Student Number
                        </th>

                        <th>
                            Student Name
                        </th>

                        <th>
                            Gender
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody id="studentsBody">

                    <tr>
                        <td
                            colspan="7"
                            class="loading"
                        >
                            Loading students...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

<div
    id="studentModal"
    class="modal"
>

    <div class="modal-card">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Student
            </h2>

            <button
                type="button"
                class="secondary"
                id="closeModalButton"
            >
                Close
            </button>

        </div>

        <form id="studentForm">

            <input
                type="hidden"
                id="studentId"
            >

            <div class="form-grid">

                <div class="field">

                    <label>
                        Institution ID
                    </label>

                    <input
                        id="institutionId"
                        required
                    >

                </div>

                <div class="field">

                    <label>
                        Student Number
                    </label>

                    <input
                        id="studentNumber"
                        required
                    >

                </div>

                <div class="field">

                    <label>
                        First Name
                    </label>

                    <input
                        id="firstName"
                        required
                    >

                </div>

                <div class="field">

                    <label>
                        Middle Name
                    </label>

                    <input
                        id="middleName"
                    >

                </div>

                <div class="field">

                    <label>
                        Last Name
                    </label>

                    <input
                        id="lastName"
                        required
                    >

                </div>

                <div class="field">

                    <label>
                        Gender
                    </label>

                    <select id="gender">

                        <option value="">
                            Select
                        </option>

                        <option value="MALE">
                            MALE
                        </option>

                        <option value="FEMALE">
                            FEMALE
                        </option>

                    </select>

                </div>

                <div class="field">

                    <label>
                        Date of Birth
                    </label>

                    <input
                        id="dateOfBirth"
                        type="date"
                    >

                </div>

                <div class="field">

                    <label>
                        Nationality
                    </label>

                    <input
                        id="nationality"
                        value="Tanzanian"
                    >

                </div>

                <div class="field">

                    <label>
                        National ID
                    </label>

                    <input id="nationalId">

                </div>

                <div class="field">

                    <label>
                        Passport Number
                    </label>

                    <input id="passportNumber">

                </div>

                <div class="field">

                    <label>
                        Phone
                    </label>

                    <input id="phone">

                </div>

                <div class="field">

                    <label>
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                    >

                </div>

                <div class="field">

                    <label>
                        Admission Year
                    </label>

                    <input
                        id="admissionYear"
                        type="number"
                    >

                </div>

                <div class="field">

                    <label>
                        Entry Type
                    </label>

                    <input id="entryType">

                </div>

                <div class="field">

                    <label>
                        Status
                    </label>

                    <select id="studentStatus">

                        <option value="ACTIVE">
                            ACTIVE
                        </option>

                        <option value="INACTIVE">
                            INACTIVE
                        </option>

                        <option value="SUSPENDED">
                            SUSPENDED
                        </option>

                        <option value="GRADUATED">
                            GRADUATED
                        </option>

                        <option value="WITHDRAWN">
                            WITHDRAWN
                        </option>

                        <option value="DEFERRED">
                            DEFERRED
                        </option>

                    </select>

                </div>

                <div class="field full">

                    <label>
                        Physical Address
                    </label>

                    <input id="physicalAddress">

                </div>

                <div class="field full">

                    <label>
                        Postal Address
                    </label>

                    <input id="postalAddress">

                </div>

                <div class="field">

                    <label>
                        Emergency Contact Name
                    </label>

                    <input id="emergencyContactName">

                </div>

                <div class="field">

                    <label>
                        Emergency Contact Phone
                    </label>

                    <input id="emergencyContactPhone">

                </div>

                <div class="field full">

                    <label>
                        Notes
                    </label>

                    <textarea
                        id="notes"
                        rows="4"
                    ></textarea>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="secondary"
                    id="cancelModalButton"
                >
                    Cancel
                </button>

                <button
                    id="saveStudentButton"
                    type="submit"
                >
                    Save Student
                </button>

            </div>

        </form>

    </div>

</div>

<script src="assets/js/idmc-session.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/rbac.js"></script>

<script>

(() => {

    "use strict";

    let students = [];

    const $ = selector =>
        document.querySelector(selector);

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

    function can(permission) {

        return (
            typeof window.IDMC_RBAC_API?.hasPermission ===
                "function" &&
            window.IDMC_RBAC_API.hasPermission(permission)
        );

    }

    function setStatus(message) {

        const element =
            $("#recordStatus");

        if (element) {
            element.textContent = message;
        }

    }

    function openModal(student = null) {

        $("#studentModal")
            ?.classList
            .add("open");

        $("#studentForm")?.reset();

        $("#studentId").value =
            student?.id || "";

        $("#modalTitle").textContent =
            student
                ? "Edit Student"
                : "Add Student";

        if (student) {

            $("#institutionId").value =
                student.institution_id || "";

            $("#studentNumber").value =
                student.student_number || "";

            $("#firstName").value =
                student.first_name || "";

            $("#middleName").value =
                student.middle_name || "";

            $("#lastName").value =
                student.last_name || "";

            $("#gender").value =
                student.gender || "";

            $("#dateOfBirth").value =
                student.date_of_birth || "";

            $("#nationality").value =
                student.nationality || "";

            $("#nationalId").value =
                student.national_id || "";

            $("#passportNumber").value =
                student.passport_number || "";

            $("#phone").value =
                student.phone || "";

            $("#email").value =
                student.email || "";

            $("#admissionYear").value =
                student.admission_year || "";

            $("#entryType").value =
                student.entry_type || "";

            $("#studentStatus").value =
                student.student_status || "ACTIVE";

            $("#physicalAddress").value =
                student.physical_address || "";

            $("#postalAddress").value =
                student.postal_address || "";

            $("#emergencyContactName").value =
                student.emergency_contact_name || "";

            $("#emergencyContactPhone").value =
                student.emergency_contact_phone || "";

            $("#notes").value =
                student.notes || "";

        }

    }

    function closeModal() {

        $("#studentModal")
            ?.classList
            .remove("open");

    }

    function renderStudents() {

        const body =
            $("#studentsBody");

        if (!body) {
            return;
        }

        if (!students.length) {

            body.innerHTML = `
                <tr>
                    <td
                        colspan="7"
                        class="empty"
                    >
                        No student records found.
                    </td>
                </tr>
            `;

            return;

        }

        body.innerHTML =
            students.map(student => {

                const name =
                    [
                        student.first_name,
                        student.middle_name,
                        student.last_name
                    ]
                        .filter(Boolean)
                        .join(" ");

                const editButton =
                    can("students.manage")
                        ? `
                            <button
                                type="button"
                                class="action-btn"
                                data-edit="${escapeHtml(student.id)}"
                            >
                                Edit
                            </button>
                        `
                        : "";

                return `
                    <tr>

                        <td>
                            ${escapeHtml(
                                student.student_number
                            )}
                        </td>

                        <td>
                            ${escapeHtml(name)}
                        </td>

                        <td>
                            ${escapeHtml(
                                student.gender
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                student.email
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                student.phone
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                student.student_status
                            )}
                        </td>

                        <td>
                            ${editButton}
                        </td>

                    </tr>
                `;

            }).join("");

        body
            .querySelectorAll("[data-edit]")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    async () => {

                        try {

                            const id =
                                button.dataset.edit;

                            const result =
                                await window.IDMC_RBAC_API
                                    .request(
                                        `/students/${id}`
                                    );

                            openModal(
                                result?.data
                            );

                        } catch (error) {

                            console.error(
                                "Unable to open student:",
                                error
                            );

                            alert(
                                error?.message ||
                                "Unable to load student."
                            );
                        }

                    }
                );

            });

    }

    async function loadStudents() {

        setStatus("Loading...");

        try {

            const params =
                new URLSearchParams();

            const search =
                $("#searchInput")
                    ?.value
                    ?.trim();

            const status =
                $("#statusFilter")
                    ?.value
                    ?.trim();

            if (search) {
                params.set(
                    "search",
                    search
                );
            }

            if (status) {
                params.set(
                    "status",
                    status
                );
            }

            params.set("page", "1");
            params.set("limit", "100");

            const query =
                params.toString()
                    ? `?${params.toString()}`
                    : "";

            const result =
                await window.IDMC_RBAC_API
                    .request(
                        `/students${query}`
                    );

            students =
                Array.isArray(result?.data?.rows)
                    ? result.data.rows
                    : [];

            renderStudents();

            setStatus(
                `${students.length} record(s)`
            );

        } catch (error) {

            console.error(
                "Failed to load students:",
                error
            );

            students = [];

            const body =
                $("#studentsBody");

            if (body) {

                body.innerHTML = `
                    <tr>
                        <td
                            colspan="7"
                            class="error"
                        >
                            ${escapeHtml(
                                error?.message ||
                                "Unable to load students."
                            )}
                        </td>
                    </tr>
                `;

            }

            setStatus(
                "Unable to load"
            );

        }

    }

    async function saveStudent(event) {

        event.preventDefault();

        if (!can("students.manage")) {

            alert(
                "You do not have permission to manage students."
            );

            return;

        }

        const id =
            $("#studentId").value.trim();

        const body = {

            institutionId:
                $("#institutionId").value.trim(),

            studentNumber:
                $("#studentNumber").value.trim(),

            firstName:
                $("#firstName").value.trim(),

            middleName:
                $("#middleName").value.trim() ||
                null,

            lastName:
                $("#lastName").value.trim(),

            gender:
                $("#gender").value || null,

            dateOfBirth:
                $("#dateOfBirth").value || null,

            nationality:
                $("#nationality").value.trim() ||
                null,

            nationalId:
                $("#nationalId").value.trim() ||
                null,

            passportNumber:
                $("#passportNumber").value.trim() ||
                null,

            phone:
                $("#phone").value.trim() ||
                null,

            email:
                $("#email").value.trim() ||
                null,

            admissionYear:
                $("#admissionYear").value
                    ? Number(
                        $("#admissionYear").value
                    )
                    : null,

            entryType:
                $("#entryType").value.trim() ||
                null,

            studentStatus:
                $("#studentStatus").value,

            physicalAddress:
                $("#physicalAddress").value.trim() ||
                null,

            postalAddress:
                $("#postalAddress").value.trim() ||
                null,

            emergencyContactName:
                $("#emergencyContactName").value.trim() ||
                null,

            emergencyContactPhone:
                $("#emergencyContactPhone").value.trim() ||
                null,

            notes:
                $("#notes").value.trim() ||
                null

        };

        try {

            const result =
                await window.IDMC_RBAC_API.request(
                    id
                        ? `/students/${id}`
                        : "/students",
                    {
                        method:
                            id
                                ? "PATCH"
                                : "POST",

                        body:
                            JSON.stringify(body)
                    }
                );

            if (!result?.success) {

                throw new Error(
                    result?.message ||
                    "Student operation failed."
                );

            }

            closeModal();

            await loadStudents();

        } catch (error) {

            console.error(
                "Student save failed:",
                error
            );

            alert(
                error?.message ||
                "Unable to save student."
            );

        }

    }

    async function initialize() {

        try {

            await window.IDMCAuth.requireAuth();

            if (
                !can("students.view")
            ) {

                document.body.innerHTML = `
                    <div style="
                        padding:40px;
                        font-family:Arial;
                        text-align:center;
                    ">
                        <h2>
                            Access Denied
                        </h2>
                        <p>
                            You do not have permission to view Students.
                        </p>
                    </div>
                `;

                return;

            }

            const addButton =
                $("#addStudentButton");

            if (
                addButton &&
                !can("students.manage")
            ) {

                addButton.style.display =
                    "none";

            }

            addButton?.addEventListener(
                "click",
                () => openModal()
            );

            $("#closeModalButton")
                ?.addEventListener(
                    "click",
                    closeModal
                );

            $("#cancelModalButton")
                ?.addEventListener(
                    "click",
                    closeModal
                );

            $("#studentForm")
                ?.addEventListener(
                    "submit",
                    saveStudent
                );

            $("#searchButton")
                ?.addEventListener(
                    "click",
                    loadStudents
                );

            $("#refreshButton")
                ?.addEventListener(
                    "click",
                    loadStudents
                );

            $("#searchInput")
                ?.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            loadStudents();

                        }

                    }
                );

            await loadStudents();

        } catch (error) {

            console.error(
                "Students page initialization failed:",
                error
            );

            setStatus(
                "Initialization failed"
            );

        }

    }

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialize,
            { once: true }
        );

    } else {

        initialize();

    }

})();

</script>

</body>
</html>
